[project]
name = "ict-facekit"
version = "0.1.0"
description = "ICT morphable face model with tongue articulation optimization"
readme = "README.md"
requires-python = ">=3.9,<3.12"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# Pyrender rendering (CPU-based, no GPU needed)
pyrender = [
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1",
]

# PyTorch with MPS support for M1/M2 Mac
pytorch-mps = [
    "torch>=2.0",
    "torchaudio>=2.0",
]

# WavLM speech inversion model
wavlm = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.30",
    "loralib>=0.1",
]

# BEAT dataset downloading
beat = [
    "huggingface_hub>=0.20",
]

# VSR (Visual Speech Recognition) dependencies
vsr = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "hydra-core>=1.3.2",
    "opencv-python>=4.5.5.62",
    "scikit-image>=0.13.0",
    "av>=10.0.0",
    "six>=1.16.0",
    "pillow>=9.0",
    "librosa>=0.9.0",
    "espnet>=0.10.0",
    "espnet-model-zoo>=0.1.0",
]

# Full feature set (optimized for M1 Mac)
all-m1 = [
    "ict-facekit[pyrender]",
    "ict-facekit[pytorch-mps]",
    "ict-facekit[wavlm]",
    "ict-facekit[beat]",
    "ict-facekit[vsr]",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
