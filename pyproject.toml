[project]
name = "ict-facekit"
version = "0.1.0"
description = "ICT morphable face model with tongue articulation optimization"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "trimesh>=4.0",
    "matplotlib>=3.8",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4",
    "tqdm>=4.60",
    # Tongue rendering stack.
    "opencv-python>=4.8",
    "pyrender>=0.1.45",
    "PyOpenGL>=3.1",
    # Audio inversion and AVSR inference.
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.15",
    "transformers>=4.30,<5",
    "loralib>=0.1",
    "huggingface_hub>=0.20",
    "hydra-core>=1.3.2",
    "scikit-image>=0.13.0",
    "av>=10.0.0",
    "six>=1.16.0",
    "mediapipe>=0.10.14",
    # Transcript evaluation and normalization helpers.
    "jiwer>=3.0",
    "g2p-en>=2.1",
    "nltk>=3.8",
    "more-itertools>=10.0",
    "regex>=2024.0.0",
    "editdistance>=0.8",
    "torch-complex>=0.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
# RetinaFace support is still intentionally excluded here: the upstream
# AutoAVSR README installs it from source rather than from a stable wheel.
retinaface = []

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = []
