[project]
name = "ict-facekit"
version = "0.1.0"
description = "ICT morphable face model with tongue articulation optimization"
readme = "README.md"
requires-python = ">=3.9,<3.12"
dependencies = [
	"numpy>=1.26",
	"scipy>=1.11",
	"trimesh>=4.0",
	"matplotlib>=3.8",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
]
